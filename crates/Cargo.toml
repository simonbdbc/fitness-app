[workspace]
members = ["weekly-ai-core", "weekly-ai-train", "weekly-ai-wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
burn = { version = "0.21.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

