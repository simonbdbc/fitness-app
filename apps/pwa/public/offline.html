<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f7f6" />
    <title>ACREA Fitness - Hors ligne</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #f3f7f6;
        color: #0d1b1d;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: #ffffff;
        border: 1px solid #cfe0dc;
        border-radius: 8px;
        box-sizing: border-box;
        max-width: 520px;
        padding: 24px;
        width: 100%;
      }

      h1 {
        font-size: 28px;
        line-height: 1.15;
        margin: 0 0 12px;
      }

      p {
        color: #38504e;
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 16px;
      }

      a,
      button {
        align-items: center;
        background: #007f5f;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        cursor: pointer;
        display: inline-flex;
        font: inherit;
        font-weight: 700;
        min-height: 44px;
        padding: 0 14px;
        text-decoration: none;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #090d10;
          color: #f4f8fb;
        }

        main {
          background: #111820;
          border-color: #30404a;
        }

        p {
          color: #c5d3dc;
        }

        a,
        button {
          background: #2ee68d;
          color: #07100a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connexion indisponible</h1>
      <p>
        ACREA Fitness ne peut pas charger cette zone pour le moment. Les donnees
        deja disponibles restent accessibles depuis l'application installee.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Reessayer</button>
        <a href="/home">Retour a l'accueil</a>
      </div>
    </main>
  </body>
</html>
